<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>Foundry learning loop · 실제 CLI 실행</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#e8eef7;font:20px "Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{height:74px;padding:20px 36px;background:#19263c;display:flex;justify-content:space-between;border-bottom:1px solid #334766}
.badge{color:#79dac9;font-size:17px}main{padding:28px 36px}h1{font-size:31px;margin:10px 0}
.guide{color:#9cbbe6;font-size:17px;letter-spacing:.06em}.check{color:#c8d5e8;margin:10px 0 22px;min-height:30px}
.controls{display:flex;gap:16px;margin-bottom:16px}select,button{font:inherit;font-size:18px;padding:12px;border:1px solid #54749c;border-radius:7px;color:#eef5ff;background:#22344d}
select{flex:1}button{min-width:160px;cursor:pointer}button:disabled{opacity:.5;cursor:default}
.command{padding:18px 22px;background:#20334c;font:17px/1.5 ui-monospace,monospace;overflow-wrap:anywhere;white-space:pre-wrap;border-radius:8px 8px 0 0}
.terminal{height:590px;overflow:auto;background:#080f1c;padding:20px 24px;font:18px/1.55 ui-monospace,"Apple SD Gothic Neo",monospace;border:1px solid #293b54;white-space:pre-wrap;overflow-wrap:anywhere}
.line{min-height:1.55em}.failed{color:#ff9994}.completed,.service_ready{color:#8be4b4}.dim{color:#92a3b9}.state{display:flex;justify-content:space-between;padding:12px 3px;font-size:17px}
footer{position:fixed;bottom:0;width:100%;padding:16px 36px;background:#19263c;display:flex;justify-content:space-between;color:#adc1de;font-size:17px}
</style>
<header><strong>Microsoft Foundry · 모델은 바꾸고, 조직의 학습은 남긴다</strong><span class="badge">실제 CLI / SDK 실행 · Playwright headless</span></header>
<main>
<div class="guide" id="guide"></div><h1 id="title">실행 화면 준비 중</h1><div class="check" id="check"></div>
<div class="controls"><select aria-label="실습 절차" id="actions"></select><button id="run">실제 명령 실행</button></div>
<div class="command" id="command"></div><div class="terminal" id="terminal" aria-label="실제 명령 출력"></div>
<div class="state"><span id="status">실행 전</span><span id="elapsed"></span></div>
</main>
<footer><span>로컬 터미널 출력을 보여 주는 녹화 화면입니다. Azure Portal / Cloud Shell을 모방한 화면이 아닙니다.</span><span>계정·구독 식별자 비식별</span></footer>
<script>
const $=id=>document.getElementById(id);
let config,state={jobs:{},events:[]},chosen=null,lastCount=-1;
function select(id){chosen=config.actions.find(a=>a.id===id);$("actions").value=id;lastCount=-1;render();}
function render(){
  if(!chosen)return;
  $("guide").textContent=chosen.guide+" · "+chosen.id;$("title").textContent=chosen.title;
  $("check").textContent="확인할 것: "+chosen.check;$("command").textContent="$ "+chosen.command;
  const job=state.jobs[chosen.id],events=state.events.filter(e=>e.action===chosen.id);
  if(lastCount!==events.length){
    const terminal=$("terminal");terminal.replaceChildren();
    if(!events.length){const line=document.createElement("div");line.className="dim";line.textContent="아직 실행하지 않았습니다. 실제 명령을 실행한 뒤 결과가 표시됩니다.";terminal.append(line);}
    for(const event of events){const line=document.createElement("div");line.className="line "+event.kind;line.textContent=event.text;terminal.append(line);}
    terminal.scrollTop=terminal.scrollHeight;lastCount=events.length;
  }
  $("status").textContent=job?({running:"실제 실행 중",completed:"실제 실행 완료",service_ready:"로컬 서버 준비 완료 · 프로세스 실행 유지",failed:"실패 · 이 시도의 기록 보존"}[job.status]):"실행 전";
  $("status").className=job?.status||"dim";
  $("elapsed").textContent=job?Math.round((job.ended||Date.now()/1000)-job.started)+"초 · 실제 경과 시간":"";
  $("run").disabled=!!state.running||!!job;
}
async function refresh(){
  const response=await fetch("/api/state");if(!response.ok)throw Error("상태 조회 실패: "+response.status);
  state=await response.json();window.actionState=state;render();
}
async function catalog(){
  const response=await fetch("/api/config");if(!response.ok)throw Error("실습 목록 조회 실패");
  config=await response.json();$("actions").replaceChildren();
  for(const action of config.actions){const option=document.createElement("option");option.value=action.id;option.textContent=action.id+" · "+action.title;$("actions").append(option);}
  select(chosen?.id||config.actions[0].id);
}
async function run(){
  const response=await fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json","X-Recording-Token":config.token},body:JSON.stringify({id:chosen.id})});
  const result=await response.json();if(!response.ok)throw Error(result.error);await refresh();
}
async function init(){
  await catalog();await refresh();$("actions").onchange=()=>select($("actions").value);
  $("run").onclick=()=>run().catch(error=>{$("status").textContent=error.message;$("status").className="failed";});
  setInterval(()=>refresh().catch(error=>{$("status").textContent=error.message;$("status").className="failed";}),500);
  window.actionConsole={select,catalog,refresh};window.actionConsoleReady=true;
}
init().catch(error=>{$("title").textContent=error.message;});
</script>
</html>
