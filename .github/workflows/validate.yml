name: Validate workshop (offline)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-lesson:
    name: Standard-library lesson / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the lesson tests without site packages
        run: python -S -m unittest discover -s tests -p test_offline_lab.py -v
      - name: Run both complete lessons without Azure or dependencies
        run: |
          python -S scripts/offline_lab.py --language en
          python -S scripts/offline_lab.py --language ko

  workshop:
    name: Python 3.13 / workshop and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install the recorded dependency set
        run: python -m pip install --quiet -r requirements.lock.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Check code, datasets, guide links, command parsers, and language parity
        run: python -m unittest discover -s tests -v
